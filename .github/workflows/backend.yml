name: backend

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/backend.yml'

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: back

jobs:
  check:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Real dependencies rather than mocks: the schema needs pgvector, the rate
    # limiter and config cache need Redis, and the upload paths need S3
    # semantics. Substituting fakes here would only prove the fakes work.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: zaolang
          POSTGRES_PASSWORD: zaolang
          POSTGRES_DB: zaolang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zaolang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      # CI never talks to the real gateway: no key, no cost, deterministic runs.
      LLM_MODE: stub
      DATABASE_URL: postgresql+psycopg://zaolang:zaolang@localhost:5432/zaolang_test
      TEST_DATABASE_URL: postgresql+psycopg://zaolang:zaolang@localhost:5432/zaolang_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret
      ADMIN_JWT_SECRET: ci-only-admin-secret
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: zaolang-media
      S3_ACCESS_KEY: zaolang
      S3_SECRET_KEY: zaolang-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            back/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # GHA services cannot pass `server /data`, so MinIO runs via docker run
      # with a pinned RELEASE tag (bitnami/minio:latest is gone from Docker Hub).
      - name: Start MinIO
        working-directory: ${{ github.workspace }}
        run: |
          docker run -d --name zaolang-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=zaolang \
            -e MINIO_ROOT_PASSWORD=zaolang-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for i in $(seq 1 30); do
            if docker exec zaolang-minio mc ready local; then exit 0; fi
            sleep 2
          done
          echo "MinIO failed to become ready" >&2
          docker logs zaolang-minio >&2 || true
          exit 1

      - name: Ensure media bucket
        run: python -c "from app.storage.s3 import ensure_bucket; ensure_bucket()"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrate the test database
        # Proves the migrations apply to an empty database, which is the thing a
        # deployment actually does. The test fixtures then reuse this schema.
        run: alembic upgrade head

      - name: Test
        run: pytest -m "not live" --cov=app --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Backend checks'
            echo
            if [ -f coverage.xml ]; then
              python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          rate = float(root.get("line-rate", 0)) * 100
          print(f"- Line coverage: **{rate:.1f}%**")
          PY
            fi
            if [ -f junit.xml ]; then
              python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"- Tests: **{total - failures - skipped} passed**, {failures} failed, {skipped} skipped")
          print(f"- Duration: {float(suite.get('time', 0)):.1f}s")
          PY
            fi
            echo
            echo 'LLM gateway forced to `stub`; no provider keys are used.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-reports
          path: |
            back/junit.xml
            back/coverage.xml
          if-no-files-found: ignore
